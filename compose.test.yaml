name: fullstack-intern-starter-test

# This is the acceptance-stack scaffold. Modules 14 and 15 extend it with
# production application images, deterministic migrations/seed data, Playwright,
# host-mounted evidence, and exit-code propagation.
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workboard_test
      POSTGRES_USER: workboard
      POSTGRES_PASSWORD: test-only-password
    volumes:
      - starter-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workboard -d workboard_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-test:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql+psycopg://workboard:test-only-password@db-test:5432/workboard_test
    depends_on:
      db-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend-test:
    build:
      context: ./frontend
      target: production
    environment:
      NUXT_PUBLIC_API_BASE: http://backend-test:8000/api/v1
      NUXT_INTERNAL_API_BASE: http://backend-test:8000/api/v1
    depends_on:
      backend-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  starter-postgres-test-data:
