name: Starter continuous integration

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: starter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - '.github/workflows/**'
              - 'compose*.yaml'
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'e2e/**'

  backend:
    name: Starter backend
    needs: changes
    # github.event_name == 'workflow_call' is deliberately first: real bug,
    # found live (Cloud Run deploy for tag v1.0.2-cors-incident, run
    # 33520744857) - dorny/paths-filter has no defined base for the
    # workflow_call event (only pull_request/push are handled), so when
    # deploy-gcp.yml's `verify` job calls this workflow to gate a real
    # deploy, `changes` silently diffs the checkout against itself, every
    # output comes back 'false', and this job (and frontend/containers/e2e
    # below) skipped - every tag-triggered deploy since Module 19's "verify
    # must run before deploy" fix had actually been shipping with zero real
    # checks executed, `verify` reporting success purely from the skip
    # cascade. Unconditionally true for workflow_call sidesteps the broken
    # diff entirely: a deploy gate should never skip a real check because a
    # path filter couldn't compute a meaningful answer, whereas the
    # existing changes.outputs.* fast path stays exactly as-is for its two
    # working triggers (pull_request, push to main).
    if: github.event_name == 'workflow_call' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workboard
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: workboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://workboard:ci-only-not-a-real-secret@localhost:5432/workboard_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Format check
        working-directory: backend
        run: ruff format --check .
      - name: Type check
        working-directory: backend
        run: python -m mypy app
      - name: Test
        working-directory: backend
        run: pytest
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Backend - ${{ job.status }}"
            echo "Python 3.13 against a real \`postgres:17-alpine\` service container: \`alembic upgrade head\`, ruff (lint + format), mypy, pytest."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Starter frontend
    needs: changes
    # See the backend job's comment above: workflow_call (deploy-gcp.yml's
    # verify gate) always runs this in full - paths-filter can't compute a
    # real diff for that event.
    if: github.event_name == 'workflow_call' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Frontend - ${{ job.status }}"
            echo "Node 22, \`npm ci\` from the committed lockfile: eslint, nuxt typecheck, vitest, nuxt build."
          } >> "$GITHUB_STEP_SUMMARY"

  containers:
    name: Starter production images
    needs: [changes, backend, frontend]
    # Same workflow_call carve-out as backend/frontend above, folded into
    # this job's existing "did anything relevant change" clause.
    if: >-
      always() &&
      needs.backend.result != 'failure' && needs.backend.result != 'cancelled' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled' &&
      (github.event_name == 'workflow_call' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm the build context cannot ship credentials
        run: |
          set -euo pipefail
          for f in .dockerignore backend/.dockerignore frontend/.dockerignore; do
            [ -f "$f" ] || { echo "::error file=$f::missing .dockerignore"; exit 1; }
          done
          grep -qx '.env' .dockerignore || { echo "::error file=.dockerignore::.env is not excluded from the root build context"; exit 1; }
          grep -qx '.git' .dockerignore || { echo "::error file=.dockerignore::.git is not excluded from the root build context"; exit 1; }
          echo "Root, backend, and frontend .dockerignore files all present; .env and .git confirmed excluded."
      - uses: docker/setup-buildx-action@v4
      - name: Build production images
        run: |
          docker build --target production --tag workboard-starter-api ./backend
          docker build --target production --tag workboard-starter-web ./frontend

  e2e:
    name: Starter end-to-end
    needs: containers
    # Deliberately just needs.containers.result == 'success' - no always()
    # override, no re-checking `changes` outputs directly. containers already
    # encodes "did anything relevant change" (it skips when nothing did) and
    # "did backend/frontend actually pass" (it skips on their real failure)
    # in its own single result value, so e2e can just trust that outcome via
    # GitHub's normal needs-skip propagation. A real, found-via-a-real-run
    # bug lived here before this fix: the previous condition only excluded
    # needs.containers.result == 'failure'/'cancelled', which let e2e run
    # even when containers was 'skipped' - including the case where it was
    # skipped *because frontend genuinely failed*, not because nothing
    # relevant changed. Confirmed live in run 32376116248 (PR #15): frontend
    # failed on a real npm-ci/lockfile mismatch, containers correctly
    # skipped, but e2e still ran anyway (and passed, since it doesn't depend
    # on containers' build output at all - see the job's own comment below).
    if: needs.containers.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bring up the acceptance stack
        run: docker compose -f compose.test.yaml up -d --build --wait --wait-timeout 180 db-test backend-test frontend-test
      - name: Run Playwright suite
        id: run
        run: |
          set +e
          docker compose -f compose.test.yaml run --rm e2e
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Collect acceptance-stack logs
        if: always()
        run: docker compose -f compose.test.yaml logs > compose-test-logs.txt 2>&1
      - name: Upload Playwright report, traces, and stack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-test-logs.txt
          retention-days: 5
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans
      - name: Job summary
        if: always()
        run: |
          {
            echo "### End-to-end - Playwright exit code ${{ steps.run.outputs.code }}"
            echo "Report/traces/stack logs uploaded as the \`e2e-evidence\` artifact regardless of outcome (retained 5 days - traces can capture page content)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the job on a real Playwright failure
        if: steps.run.outputs.code != '0'
        run: exit 1
