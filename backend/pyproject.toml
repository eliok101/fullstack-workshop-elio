[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "workboard-starter-backend"
version = "0.1.0"
description = "FastAPI health-check starter for the full-stack intern workshop"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "email-validator==2.2.0",
  "fastapi==0.139.2",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "python-multipart==0.0.20",
  "PyJWT==2.13.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "mypy==1.14.1",
  "pytest==9.1.1",
  "pytest-cov==6.0.0",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88
# Alembic-generated migration files are historical, applied artifacts, not
# hand-maintained application code - they shouldn't need to satisfy the same
# lint bar (e.g. an autogenerated migration's unused "import sqlalchemy as sa"
# when a revision only uses op.* calls), and editing an already-applied
# migration file to appease a linter is exactly the risk Module 06 warned
# against. Excluding the whole directory is more sustainable than one-off
# fixes, since it also covers any future autogenerated migration.
extend-exclude = ["migrations/versions"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# A diagnostic floor, not a target: catches regressions (e.g. deleted tests,
# an unguarded new branch) without demanding every line be covered. Current
# branch coverage is ~94%; 90% leaves real headroom for future modules'
# code to land before this gate would need raising.
fail_under = 90
show_missing = true
skip_covered = false
