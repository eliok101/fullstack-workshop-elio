[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "workboard-starter-backend"
version = "0.1.0"
description = "FastAPI health-check starter for the full-stack intern workshop"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.139.2",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "mypy==1.14.1",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88
